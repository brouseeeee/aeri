name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-bridge.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build native bridge and app
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r tools\requirements-bridge.txt
          npm run build

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: npm run build:installer

      - name: Create portable archive
        id: portable
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $archive = "release\Aeri-$version-portable-win32-x64.zip"
          Compress-Archive -Path "release\Aeri-win32-x64\*" -DestinationPath $archive -CompressionLevel Optimal
          "path=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          gh release upload "$env:GITHUB_REF_NAME" `
            "release\Aeri-$version-Setup.exe" `
            "${{ steps.portable.outputs.path }}" `
            --clobber
