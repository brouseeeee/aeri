<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Aeri</title>
  <!-- <link rel="stylesheet" href="../../style.css" /> -->
  <link rel="stylesheet" href="windows-10.css" />
</head>

<body>
  <div class="windows-10-widget">
    <div class="volume-bar noise">
      <div class="mixer">
        <div class="empty"></div>
        <div class="slider"></div>
        <div class="filled"></div>
      </div>
      <div class="volume-counter">22</div>
    </div>
    <div class="composition-plane noise">
      <div class="menu">
        <div class="title">
          <span class="title-text">Hello everyone my body</span>
          <span class="author-text">Hello everyone my love subscribers and my mom</span>
        </div>
        <div class="function-menu">
          <div class="timeline">
            <span class="current-time">1:24</span>
            <div class="progressbar">
              <div class="filled"></div>
              <div class="slider"></div>
              <div class="empty"></div>
            </div>
            <span class="end-time">2:48</span>
          </div>
          <div class="buttons">
            <button class="prev">
              <span class="icon-prev">&#xE892;</span>
            </button>
            <button class="pause-play">
              <span class="icon-pause-play">&#xE103;</span>
            </button>
            <button class="next">
              <span class="icon-next">&#xE893;</span>
            </button>
          </div>
        </div>
      </div>
      <div class="cover">
        <img class="cover-art-blur" alt="" aria-hidden="true" />
        <img class="cover-art" alt="" />
        <span class="cover-placeholder" aria-hidden="true">&#xEC4F;</span>
        <div class="app-icon-frame" aria-hidden="true">
          <img class="app-icon" alt="" />
        </div>
      </div>
    </div>
  </div>
  </div>
  <script src="slider.js"></script>
  <script src="reveal.js"></script>
</body>

</html>
